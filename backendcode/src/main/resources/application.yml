server:
  port: 8080

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: running-app-service
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/running_app_db}
      database: running_app_db

app:
  jwt:
    secret: ${JWT_SECRET:?Set JWT_SECRET in your environment (.env) to a 32+ character random string}
    expiration-millis: ${JWT_EXPIRATION_MILLIS:3600000}
