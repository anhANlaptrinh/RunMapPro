spring.application.name=running-app-service
spring.config.import=optional:file:.env[.properties]

spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/running_app_db}
spring.data.mongodb.database=running_app_db

app.jwt.secret=${JWT_SECRET:?Set JWT_SECRET in your environment (.env) to a 32+ character random string}
app.jwt.expiration-millis=${JWT_EXPIRATION_MILLIS:3600000}

# Email Configuration (Gmail SMTP for development)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${EMAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.from=${EMAIL_FROM:noreply@runmappro.com}

# OTP Configuration
app.otp.expiration-minutes=5
app.otp.length=6

logging.level.org.springframework.security=DEBUG
logging.level.com.example.runningapp.security=DEBUG
